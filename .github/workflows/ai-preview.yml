name: AI preview

on:
  push:
    branches: [feat/ai-reading-assistant]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-preview-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build preview
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --console=plain
      - name: Upload installable APK and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XNotes-AI-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
